<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="tbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tbGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded container -->
  <rect width="48" height="48" rx="12" fill="#090d16"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#1e293b" fill="none"/>

  <!-- Radar & Return Loop Monogram (T & B) -->
  <!-- Outer Sweep Arc -->
  <path d="M12 24 C12 17.37 17.37 12 24 12 C30.63 12 36 17.37 36 24 C36 27.5 34.5 30.6 32.1 32.8"
        fill="none" stroke="url(#tbGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Return Arrow Loop -->
  <path d="M33 32 L36 32 L36 24 C36 17.37 30.63 12 24 12 L18 12"
        fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Inner Compass / Location Target Center -->
  <circle cx="24" cy="24" r="4.5" fill="url(#tbGrad)"/>
  <circle cx="24" cy="24" r="2" fill="#ffffff"/>

  <!-- Directional Return Vector Arrow -->
  <path d="M15 15 L21 15 L18 12 Z" fill="#38bdf8"/>
  <path d="M24 36 L24 28.5" stroke="url(#tbGlow)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="24" cy="36" r="2.5" fill="#38bdf8"/>
</svg>
