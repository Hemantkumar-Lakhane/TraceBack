name: TraceBack CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    name: Build & Run QA Regression Test Suite

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'TraceBack/frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./TraceBack/frontend
        run: npm ci

      - name: Run Automated QA Test Suite (15 Test Cases)
        working-directory: ./TraceBack/frontend
        run: npm test

      - name: Build Frontend Production Artifacts
        working-directory: ./TraceBack/frontend
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test Spring Boot Backend
        working-directory: ./TraceBack/backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

